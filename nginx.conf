# =============================================================
# NGINX.CONF — Serveur web Angular + reverse proxy
# =============================================================
# 1. Sert l'app Angular (fichiers statiques)
# 2. Redirige /api/ vers Django, /ia/ vers FastAPI, /media/ vers Django
#
# IMPORTANT : le résolveur DNS Docker (127.0.0.11) et les variables
# dans proxy_pass obligent nginx à retrouver l'adresse des services
# à chaque requête. Sans cela, nginx garde l'ancienne IP d'un
# conteneur reconstruit et renvoie des erreurs 502.
# =============================================================

server {

    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------
    # Résolveur DNS interne de Docker (ré-interroge toutes les 10 s)
    # ----------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ----------------------------------------------------------
    # Taille maximale des envois (photos de téléphone)
    # ----------------------------------------------------------
    client_max_body_size 10M;

    # ----------------------------------------------------------
    # Compression Gzip
    # ----------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ----------------------------------------------------------
    # PROXY → Backend Django (/api/)
    # Avec une variable, l'URL d'origine (/api/scans/) est
    # transmise telle quelle à Django.
    # ----------------------------------------------------------
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # ----------------------------------------------------------
    # PROXY → Microservice IA FastAPI (/ia/)
    # Avec une variable, nginx ne retire plus le préfixe /ia/
    # tout seul : le "rewrite" s'en charge.
    # Exemple : POST /ia/analyser/ → http://ia-service:8001/analyser/
    # ----------------------------------------------------------
    location /ia/ {
        set $ia_upstream http://ia-service:8001;
        rewrite ^/ia/(.*)$ /$1 break;
        proxy_pass $ia_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 300s;
    }

    # ----------------------------------------------------------
    # PROXY → Fichiers médias Django (/media/)
    # ----------------------------------------------------------
    location ^~ /media/ {
        set $media_upstream http://backend:8000;
        proxy_pass $media_upstream;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------
    # Routage Angular (SPA)
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # Cache des assets statiques
    # ----------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
