# =============================================================
# NGINX.CONF — Configuration du serveur web pour Angular
# =============================================================
# Nginx joue ici deux rôles :
#   1. Serveur de fichiers statiques → sert l'app Angular
#   2. Reverse proxy → redirige les appels API vers Django
#      et les appels IA vers FastAPI
#
# Un "reverse proxy" est un intermédiaire : le frontend appelle
# Nginx, et Nginx transmet la requête au bon service en coulisses.
# Cela évite les problèmes CORS et centralise les accès.
# =============================================================

server {

    # ----------------------------------------------------------
    # Port d'écoute
    # ----------------------------------------------------------
    # Nginx écoute sur le port 80 (HTTP).
    # Dans docker-compose, ce port est mappé sur 4200 de la machine hôte.
    # ----------------------------------------------------------
    listen 80;

    # ----------------------------------------------------------
    # Racine des fichiers Angular
    # ----------------------------------------------------------
    # Dossier où sont déposés les fichiers compilés par Angular.
    # C'est là que Nginx cherche index.html et les assets.
    # ----------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------
    # Compression Gzip
    # ----------------------------------------------------------
    # Compresse les réponses (JS, CSS, JSON) avant de les envoyer
    # au navigateur. Réduit la taille des transferts de ~70%.
    # ----------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ----------------------------------------------------------
    # PROXY → Backend Django (/api/)
    # ----------------------------------------------------------
    # Toutes les requêtes commençant par /api/ sont redirigées
    # vers le conteneur Django (nom "backend" dans docker-compose).
    # Exemple : GET /api/users/ → http://backend:8000/api/users/
    # ----------------------------------------------------------
    location /api/ {
        # "proxy_pass" transmet la requête au service backend
        proxy_pass http://backend:8000;

        # Transmet l'hôte original au backend (utile pour Django)
        proxy_set_header Host $host;

        # Transmet l'IP réelle du client au backend
        proxy_set_header X-Real-IP $remote_addr;

        # Indique que la requête passe par un proxy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout pour les requêtes longues (ex: upload d'image, PayDunya)
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # ----------------------------------------------------------
    # PROXY → Microservice IA FastAPI (/ia/)
    # ----------------------------------------------------------
    # Les appels au microservice IA passent par /ia/
    # et sont redirigés vers le conteneur FastAPI.
    # Exemple : POST /ia/analyser/ → http://ia-service:8001/analyser/
    # ----------------------------------------------------------
    location /ia/ {
        # Redirige vers FastAPI en supprimant le préfixe /ia/
        proxy_pass http://ia-service:8001/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout plus long pour l'analyse IA (appel Gemini peut être lent)
        proxy_read_timeout 300s;
    }

    # ----------------------------------------------------------
    # PROXY → Fichiers médias Django (/media/)
    # ----------------------------------------------------------
    # Les images uploadées (photos de déchets) sont stockées
    # par Django dans son dossier media/. On les sert via Nginx.
    # ----------------------------------------------------------
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------
    # Routage Angular (SPA — Single Page Application)
    # ----------------------------------------------------------
    # Angular est une SPA : il n'y a qu'un seul fichier HTML
    # (index.html). Toutes les "pages" sont gérées par le router
    # Angular côté client.
    #
    # Sans cette règle, si l'utilisateur accède directement à
    # l'URL /scan ou /historique, Nginx chercherait un fichier
    # /scan.html qui n'existe pas et retournerait une erreur 404.
    #
    # "try_files $uri $uri/ /index.html" dit à Nginx :
    #   1. Cherche le fichier exact demandé ($uri)
    #   2. Sinon cherche un dossier ($uri/)
    #   3. Sinon retourne toujours index.html → Angular prend le relais
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # Cache des assets statiques
    # ----------------------------------------------------------
    # Les fichiers JS/CSS/images Angular ont des noms uniques
    # générés lors du build (ex: main.abc123.js). On peut donc
    # les mettre en cache très longtemps dans le navigateur.
    # ----------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
