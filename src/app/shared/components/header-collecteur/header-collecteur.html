<!--
  Header commun à toutes les pages de l'espace collecteur.
  - Desktop : à droite du sidebar, fond blanc, nom + avatar.
  - Mobile / tablette : simple bouton cloche dans le coin droit de la barre sombre du menu.
-->
<header
  class="fixed right-0 top-0 z-[35] flex h-14 w-14 items-center justify-center bg-[#0E172B]
         lg:left-[220px] lg:z-30 lg:h-[60px] lg:w-auto lg:justify-between lg:border-b lg:border-slate-100 lg:bg-white lg:px-4
         xl:px-6"
>

  <!-- ========================================================= -->
  <!-- TITRE DE LA PAGE (desktop uniquement) -->
  <!-- ========================================================= -->

  <div class="hidden lg:block">
    <h1 class="text-[15px] font-bold text-[#142337]">
      Dashboard collecteur
    </h1>
  </div>


  <!-- ========================================================= -->
  <!-- ACTIONS À DROITE -->
  <!-- ========================================================= -->

  <div class="flex items-center gap-3 lg:ml-auto">

    <!-- Notifications -->
    <button
      type="button"
      (click)="ouvrirNotifications()"
      class="relative flex h-10 w-10 items-center justify-center rounded-xl text-white transition hover:bg-white/10
             lg:h-8 lg:w-8 lg:rounded-full lg:text-slate-600 lg:hover:bg-slate-50 lg:hover:text-[#087C78]"
      aria-label="Notifications"
    >
      <svg class="h-5 w-5 lg:h-4 lg:w-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>
      <!-- Indicateur de nouvelle notification -->
      <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-[#0EA5A4] lg:right-1.5 lg:top-1.5 lg:h-1 lg:w-1"></span>
    </button>

    <!-- Infos collecteur (desktop uniquement) -->
    <div class="hidden items-center gap-2 lg:flex">
      <div class="text-right leading-tight">
        <p class="text-[11px] font-bold text-[#142337]">{{ nomAffiche() }}</p>
        <p class="text-[9px] font-semibold uppercase tracking-wide text-[#087C78]">
          Collecteur Agréé
        </p>
      </div>

      <!-- Avatar collecteur -->
      <button
        routerLink="/collecteur/profil"
        type="button"
        class="flex h-9 w-9 items-center justify-center rounded-full bg-[#0EA5A4] text-white font-bold text-sm"
        aria-label="Profil collecteur"
      >
        {{ initiales() }}
      </button>

    </div>

  </div>

</header>
