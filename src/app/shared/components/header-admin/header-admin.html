
<!--
  Header commun à toutes les pages administrateur.
  - Desktop : à droite du sidebar, fond blanc, statuts + notifications + avatar.
  - Mobile / tablette : bouton cloche dans le coin droit de la barre sombre du menu.
-->

<header
  class="fixed right-0 top-0 z-[35] flex h-14 w-14 items-center justify-center bg-[#0E172B]
         lg:left-[220px] lg:z-30 lg:h-[60px] lg:w-auto lg:justify-end lg:border-b lg:border-slate-100 lg:bg-white lg:px-4
         xl:px-6"
>

  <!-- ========================================================= -->
  <!-- ACTIONS À DROITE -->
  <!-- ========================================================= -->

  <div class="flex items-center gap-3 lg:ml-auto">

    <!-- ========================================================= -->
    <!-- STATUT DE LA PLATEFORME (desktop uniquement) -->
    <!-- ========================================================= -->

    <div class="hidden items-center gap-1.5 md:flex">

      <!-- Petit indicateur vert -->
      <span class="h-1.5 w-1.5 rounded-full bg-[#0B8D80]"></span>

      <!-- État de la plateforme -->
      <div class="leading-tight">
        <p class="text-[9px] text-slate-600">
          Plateforme active
        </p>

        <p class="text-[9px] text-slate-600">
          (Dakar)
        </p>
      </div>

    </div>


    <!-- ========================================================= -->
    <!-- SYSTÈME OPÉRATIONNEL (desktop uniquement) -->
    <!-- ========================================================= -->

    <div
      class="hidden items-center gap-1.5 rounded-full bg-[#EEF4FF] px-2.5 py-1.5 sm:flex"
    >

      <!-- Icône de connexion -->
      <svg
        class="h-3.5 w-3.5 text-[#087C78]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 18h.01"></path>
        <path d="M8.5 14.5a5 5 0 0 1 7 0"></path>
        <path d="M5 11a10 10 0 0 1 14 0"></path>
      </svg>

      <!-- Texte du statut -->
      <span class="text-[9px] font-bold leading-tight text-[#142337]">
        Système<br />
        Opérationnel
      </span>

    </div>


    <!-- ========================================================= -->
    <!-- NOTIFICATIONS -->
    <!-- Mobile / tablette : cloche blanche sur fond sombre -->
    <!-- Desktop : cloche grise sur fond blanc -->
    <!-- ========================================================= -->

    <button
      type="button"
      (click)="ouvrirNotifications()"
      class="relative flex h-10 w-10 items-center justify-center rounded-xl text-white transition hover:bg-white/10
             lg:h-8 lg:w-8 lg:rounded-full lg:text-slate-600 lg:hover:bg-slate-50 lg:hover:text-[#087C78]"
      aria-label="Notifications"
    >

      <!-- Icône cloche -->
      <svg
        class="h-5 w-5 lg:h-4 lg:w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>

      <!-- Indicateur de nouvelle notification -->
      <span
        class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-[#0EA5A4]
               lg:right-1.5 lg:top-1.5 lg:h-1 lg:w-1"
      ></span>

    </button>


    <!-- ========================================================= -->
    <!-- AVATAR ADMINISTRATEUR (desktop uniquement) -->
    <!-- ========================================================= -->

    <button
      routerLink="/admin/profile-admin"
      type="button"
      class="hidden h-8 w-8 items-center justify-center rounded-full bg-[#0EA5A4] text-white lg:flex"
      aria-label="Profil administrateur"
    >

      <!-- Icône utilisateur -->
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="8" r="3"></circle>
        <path d="M5 20c.8-3.5 3.1-5.5 7-5.5s6.2 2 7 5.5"></path>
      </svg>

    </button>

  </div>

</header>
