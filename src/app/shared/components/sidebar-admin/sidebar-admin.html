<!--
  Sidebar de l'espace administrateur.
  - Desktop (lg+) : barre latérale fixe de 220 px.
  - Mobile / tablette : barre du haut avec burger, menu dans un tiroir.
  L'ouverture est pilotée par une case à cocher cachée (aucun TypeScript requis).
-->

<!-- Case qui pilote le tiroir (doit rester avant l'overlay et l'aside) -->
<input
  #menuToggle
  id="menu-admin"
  type="checkbox"
  class="peer sr-only"
  aria-label="Ouvrir le menu"
  (keydown.escape)="menuToggle.checked = false"
/>

<!-- BARRE DU HAUT : mobile et tablette uniquement -->
<header class="fixed inset-x-0 top-0 z-30 flex h-14 items-center justify-between bg-[#0E172B] px-4 shadow-md lg:hidden">
  <label
    for="menu-admin"
    role="button"
    aria-label="Ouvrir le menu"
    class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl text-white transition hover:bg-white/10"
  >
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6h16"></path>
      <path d="M4 12h16"></path>
      <path d="M4 18h16"></path>
    </svg>
  </label>

  <a routerLink="/admin" class="flex items-center">
    <img src="assets/logo-dechetscan.png" alt="DechetScan" class="h-12 w-auto object-contain" />
  </a>

  <a
    routerLink="/admin/notifications"
    aria-label="Notifications"
    class="flex h-10 w-10 items-center justify-center rounded-xl text-white transition hover:bg-white/10"
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
      <path d="M10 21h4"></path>
    </svg>
  </a>
</header>

<!-- FOND SOMBRE derrière le tiroir : mobile uniquement, un clic ferme le menu -->
<label
  for="menu-admin"
  aria-hidden="true"
  class="pointer-events-none fixed inset-0 z-40 bg-black/50 opacity-0 backdrop-blur-[1px] transition-opacity duration-300 peer-checked:pointer-events-auto peer-checked:opacity-100 lg:hidden"
></label>

<!-- SIDEBAR : tiroir sur mobile, barre fixe sur desktop -->
<aside
  class="fixed inset-y-0 left-0 z-50 flex w-[280px] max-w-[85vw] -translate-x-full flex-col bg-[#0E172B] px-4 py-5 transition-transform duration-300 ease-out peer-checked:translate-x-0
         lg:z-40 lg:w-[220px] lg:max-w-none lg:translate-x-0"
>

  <!-- LOGO + bouton fermer (mobile) -->
  <div class="flex items-center justify-between px-1">
    <img
      src="assets/logo-dechetscan.png"
      alt="DechetScan"
      class="h-20 w-auto object-contain lg:h-[110px]"
    />

    <label
      for="menu-admin"
      role="button"
      aria-label="Fermer le menu"
      class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl text-slate-300 transition hover:bg-white/10 hover:text-white lg:hidden"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 6l12 12"></path>
        <path d="M18 6L6 18"></path>
      </svg>
    </label>
  </div>

  <!-- BADGE ADMIN -->
  <div
    class="mt-4 inline-flex w-fit rounded-full bg-[#8FEDE2] px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-wide text-[#087C78] lg:mt-6 lg:text-[9px]"
  >
    Console Admin
  </div>

  <!-- MENU PRINCIPAL -->
  <nav class="mt-3 flex-1 space-y-0.5 overflow-y-auto lg:mt-2.5">

    <!-- Tableau de bord -->
    <a
      routerLink="/admin"
      routerLinkActive="bg-[#11AAA9] text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="menuToggle.checked = false"
      class="group flex h-11 items-center gap-3 rounded-lg px-3 text-[13px] font-bold text-slate-200 transition hover:bg-[#18263D] lg:h-[40px] lg:gap-2.5 lg:text-[11px]"
    >
      <svg class="h-[18px] w-[18px] shrink-0 lg:h-4 lg:w-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="6" height="6" rx="1"></rect>
        <rect x="14" y="4" width="6" height="6" rx="1"></rect>
        <rect x="4" y="14" width="6" height="6" rx="1"></rect>
        <rect x="14" y="14" width="6" height="6" rx="1"></rect>
      </svg>
      Tableau de bord
    </a>

    <!-- Utilisateurs -->
    <a
      routerLink="/admin/utilisateurs"
      routerLinkActive="bg-[#11AAA9] text-white"
      (click)="menuToggle.checked = false"
      class="group flex h-11 items-center gap-3 rounded-lg px-3 text-[13px] font-bold text-slate-200 transition hover:bg-[#18263D] lg:h-[40px] lg:gap-2.5 lg:text-[11px]"
    >
      <svg class="h-[18px] w-[18px] shrink-0 lg:h-4 lg:w-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3"></circle>
        <path d="M3.5 19c.6-3.2 2.4-5 5.5-5s4.9 1.8 5.5 5"></path>
        <path d="M16 5.5a3 3 0 0 1 0 5.5"></path>
        <path d="M16 14c2.3.2 3.8 1.8 4.5 4"></path>
      </svg>
      Utilisateurs
    </a>

    <!-- Points de collecte -->
    <a
      routerLink="/admin/admin-collecte"
      routerLinkActive="bg-[#11AAA9] text-white"
      (click)="menuToggle.checked = false"
      class="group flex h-11 items-center gap-3 rounded-lg px-3 text-[13px] font-bold text-slate-200 transition hover:bg-[#18263D] lg:h-[40px] lg:gap-2.5 lg:text-[11px]"
    >
      <svg class="h-[18px] w-[18px] shrink-0 lg:h-4 lg:w-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
        <circle cx="12" cy="10" r="2.5"></circle>
      </svg>
      Points de collecte
    </a>

    <!-- Collecteurs -->
    <a
      routerLink="/admin/collecteurs"
      routerLinkActive="bg-[#11AAA9] text-white"
      (click)="menuToggle.checked = false"
      class="group flex h-11 items-center gap-3 rounded-lg px-3 text-[13px] font-bold text-slate-200 transition hover:bg-[#18263D] lg:h-[40px] lg:gap-2.5 lg:text-[11px]"
    >
      <svg class="h-[18px] w-[18px] shrink-0 lg:h-4 lg:w-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="3" width="15" height="13" rx="2"></rect>
        <path d="M16 8h4l3 3v5h-7V8z"></path>
        <circle cx="5.5" cy="18.5" r="2.5"></circle>
        <circle cx="18.5" cy="18.5" r="2.5"></circle>
      </svg>
      Collecteurs
    </a>

    <!-- Référentiel des déchets -->
    <a
      routerLink="/admin/referentiel-dechets/types"
      routerLinkActive="bg-[#11AAA9] text-white"
      (click)="menuToggle.checked = false"
      class="group flex h-11 items-center gap-3 rounded-lg px-3 text-[13px] font-bold text-slate-200 transition hover:bg-[#18263D] lg:h-[40px] lg:gap-2.5 lg:text-[11px]"
    >
      <svg class="h-[18px] w-[18px] shrink-0 lg:h-4 lg:w-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h6l2 3h8"></path>
        <path d="M4 7v11h16V10"></path>
        <path d="M8 14h8"></path>
      </svg>
      Référentiel des déchets
    </a>

    <!-- Scans -->
    <a
      routerLink="/admin/tous-scans"
      routerLinkActive="bg-[#11AAA9] text-white"
      (click)="menuToggle.checked = false"
      class="group flex h-11 items-center gap-3 rounded-lg px-3 text-[13px] font-bold text-slate-200 transition hover:bg-[#18263D] lg:h-[40px] lg:gap-2.5 lg:text-[11px]"
    >
      <svg class="h-[18px] w-[18px] shrink-0 lg:h-4 lg:w-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="5" width="14" height="16" rx="2"></rect>
        <path d="M8 9h8"></path>
        <path d="M8 13h8"></path>
        <path d="M8 17h5"></path>
      </svg>
      Scans
    </a>

    <!-- Notifications -->
    <a
      routerLink="/admin/notifications"
      routerLinkActive="bg-[#11AAA9] text-white"
      (click)="menuToggle.checked = false"
      class="group flex h-11 items-center gap-3 rounded-lg px-3 text-[13px] font-bold text-slate-200 transition hover:bg-[#18263D] lg:h-[40px] lg:gap-2.5 lg:text-[11px]"
    >
      <svg class="h-[18px] w-[18px] shrink-0 lg:h-4 lg:w-4" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>
      Notifications
    </a>

  </nav>


<!-- Profil de l'administrateur connecté -->
<div class="mt-2 rounded-xl bg-[#F1F5FF] p-2.5">
  <div class="flex items-center gap-2">

    <!-- Initiales dynamiques -->
    <div
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#087C78] text-[10px] font-extrabold text-white lg:h-8 lg:w-8"
    >
      {{ initialesAdmin }}
    </div>

    <!-- Nom et e-mail réels -->
    <div class="min-w-0 flex-1">
      <p
        class="truncate text-[11px] font-extrabold text-[#142337] lg:text-[10px]"
      >
        {{ nomCompletAdmin }}
      </p>

      <p
        class="truncate text-[10px] text-slate-600 lg:text-[9px]"
      >
        {{ interfaceProfil.email || interfaceProfil.username || 'E-mail indisponible' }}
      </p>
    </div>

    <!-- Bouton de déconnexion -->
    <button
      (click)="menuToggle.checked = false; deconnecter()"
      type="button"
      aria-label="Se déconnecter"
      class="flex h-9 w-9 items-center justify-center rounded-lg text-slate-600 transition hover:bg-white hover:text-[#087C78] lg:h-auto lg:w-auto"
    >
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M10 17l5-5-5-5"></path>
        <path d="M15 12H3"></path>
        <path d="M21 5v14"></path>
      </svg>
    </button>

  </div>
</div>

</aside>
