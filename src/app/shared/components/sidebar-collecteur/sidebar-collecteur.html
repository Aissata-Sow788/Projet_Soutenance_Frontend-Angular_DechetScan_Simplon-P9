<!--
  Sidebar principal de l'espace collecteur.
  Fond sombre #0E172B, identique au sidebar admin.
  Liens vers toutes les pages du dashboard collecteur.
-->
<aside
  class="fixed inset-y-0 left-0 z-40 hidden w-[220px] flex-col bg-[#0E172B] px-4 py-5 lg:flex"
>

  <!-- LOGO -->
  <div class="flex items-center px-1">
    <img
      src="assets/logo-dechetscan.png"
      alt="DechetScan"
      class="h-[110px] w-auto object-contain"
    />
  </div>

  <!-- BADGE COLLECTEUR -->
  <div
    class="mt-6 inline-flex w-fit rounded-full bg-[#8FEDE2] px-2.5 py-1 text-[9px] font-extrabold uppercase tracking-wide text-[#087C78]"
  >
    Espace Collecteur
  </div>

  <!-- MENU PRINCIPAL -->
  <nav class="mt-2.5 space-y-0.5 overflow-y-auto flex-1">

    <!-- Tableau de bord -->
    <a
      routerLink="/collecteur"
      routerLinkActive="bg-[#11AAA9] text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="6" height="6" rx="1"></rect>
        <rect x="14" y="4" width="6" height="6" rx="1"></rect>
        <rect x="4" y="14" width="6" height="6" rx="1"></rect>
        <rect x="14" y="14" width="6" height="6" rx="1"></rect>
      </svg>
      Tableau de bord
    </a>

    <!-- Demandes de collecte -->
    <a
      routerLink="/collecteur/demandes"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="5" width="14" height="16" rx="2"></rect>
        <path d="M8 9h8"></path>
        <path d="M8 13h8"></path>
        <path d="M8 17h5"></path>
      </svg>
      Demandes de collecte
    </a>

    <!-- Planification -->
    <a
      routerLink="/collecteur/planification"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"></rect>
        <path d="M16 2v4"></path>
        <path d="M8 2v4"></path>
        <path d="M3 10h18"></path>
      </svg>
      Planification
    </a>

    <!-- Mes collectes -->
    <a
      routerLink="/collecteur/mes-collectes"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="3" width="15" height="13" rx="2"></rect>
        <path d="M16 8h4l3 3v5h-7V8z"></path>
        <circle cx="5.5" cy="18.5" r="2.5"></circle>
        <circle cx="18.5" cy="18.5" r="2.5"></circle>
      </svg>
      Mes collectes
    </a>

    <!-- Historique des collectes -->
    <a
      routerLink="/collecteur/historique"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"></path>
        <path d="M3 3v5h5"></path>
        <path d="M12 7v5l3 2"></path>
      </svg>
      Historique
    </a>

    <!-- Points de collecte -->
    <a
      routerLink="/collecteur/points-collecte"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path>
        <circle cx="12" cy="10" r="2.5"></circle>
      </svg>
      Points de collecte
    </a>

    <!-- Ventes -->
    <a
      routerLink="/collecteur/ventes"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 0 1-8 0"></path>
      </svg>
      Ventes
    </a>

    <!-- Abonnement -->
    <a
      routerLink="/collecteur/abonnement"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"></path>
      </svg>
      Abonnement
    </a>

    <!-- Paiements -->
    <a
      routerLink="/collecteur/paiements"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
        <path d="M2 10h20"></path>
      </svg>
      Paiements
    </a>

    <!-- Notifications -->
    <a
      routerLink="/collecteur/notifications"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>
      Notifications
    </a>

    <!-- Profil -->
    <a
      routerLink="/collecteur/profil"
      routerLinkActive="bg-[#11AAA9] text-white"
      class="group flex h-[38px] items-center gap-2.5 rounded-lg px-3 text-[11px] font-bold text-slate-200 transition hover:bg-[#18263D]"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3"></circle>
        <path d="M5 20c.8-3.5 3.1-5.5 7-5.5s6.2 2 7 5.5"></path>
      </svg>
      Profil
    </a>

  </nav>

  <!-- STATUT CONNEXION + PROFIL -->
  <div class="mt-2 space-y-2">

    <!-- Indicateur de zone -->
    <div class="rounded-xl bg-[#18263D] px-3 py-2">
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-[#0EA5A4]"></span>
        <div>
          <p class="text-[9px] font-bold text-slate-200">CONNECTÉ</p>
          <p class="text-[9px] text-slate-400">Zone: Dakar Plateau</p>
        </div>
      </div>
      <p class="mt-1 text-[8px] text-slate-500">V 1.0 PRO</p>
    </div>

    <!-- Profil + déconnexion -->
    <div class="rounded-xl bg-[#F1F5FF] p-2.5">
      <div class="flex items-center gap-2">
        <div
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#087C78] text-[10px] font-extrabold text-white"
        >
          CO
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-[10px] font-extrabold text-[#142337]">Collecteur</p>
          <p class="truncate text-[9px] text-slate-600">collecteur@dechetscan.com</p>
        </div>
        <button
          (click)="deconnecter()"
          type="button"
          class="text-slate-600 transition hover:text-[#087C78]"
          aria-label="Se déconnecter"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 17l5-5-5-5"></path>
            <path d="M15 12H3"></path>
            <path d="M21 5v14"></path>
          </svg>
        </button>
      </div>
    </div>

  </div>

</aside>
