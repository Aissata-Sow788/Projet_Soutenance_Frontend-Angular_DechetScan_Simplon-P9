
<!-- Page Mes ventes — responsive mobile, tablette et desktop -->

<div class="citizen-responsive citizen-list citizen-sales min-h-screen bg-[#F3F4F4] pb-36 sm:pb-40 lg:pb-44 ">


  <!-- Conteneur principal : contenu centré sur les grands écrans -->
  <div class="mx-auto w-full max-w-[1440px]">

    <!-- En-tête de la page -->
    <header
      class="flex h-14 items-center gap-3 bg-white px-4 shadow-sm
             sm:px-6 lg:h-16 lg:px-10"
    >
      <!-- Retour à la page précédente -->
      <button
        (click)="retour()"
        type="button"
        aria-label="Retour"
        class="flex h-9 w-9 shrink-0 items-center justify-center
               rounded-full text-[#142337] transition hover:bg-slate-100"
      >
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </button>

      <h1 class="text-[17px] font-bold text-[#142337] lg:text-lg">
        Mes ventes
      </h1>
    </header>

    <!-- État de chargement -->
    @if (chargement()) {
      <div class="flex items-center justify-center py-20">
        <span
          class="h-5 w-5 animate-spin rounded-full border-2
                 border-slate-200 border-t-[#0EA5A4]"
          role="status"
          aria-label="Chargement des ventes"
        ></span>
      </div>
    }

    <!-- Message d'erreur -->
    @else if (erreur()) {
      <div
        class="mx-4 mt-6 rounded-2xl bg-red-50 p-4 text-sm text-red-600
               sm:mx-6 lg:mx-10 lg:mt-8"
      >
        {{ erreur() }}
      </div>
    }

    <!-- Contenu principal lorsque les données sont disponibles -->
    @else {

      <!-- Carte du montant total gagné -->
      <section
        class="citizen-sales-total mx-4 mt-5 rounded-2xl bg-[#0E172B]
               px-5 py-5 sm:mx-6 sm:px-7 sm:py-6
               lg:mx-10 lg:mt-8 lg:px-8 lg:py-7"
        aria-label="Bilan des ventes"
      >
        <p
          class="text-[11px] font-bold uppercase tracking-widest
                 text-[#0EA5A4]"
        >
          TOTAL GAGNÉ
        </p>

        <!-- Montant total -->
        <p
          class="mt-2 break-words text-[30px] font-black leading-tight
                 text-white sm:text-[34px] lg:text-[38px]"
        >
          {{ totalGagne() | number:'1.0-0' }} FCFA
        </p>

        <!-- Indicateur du portefeuille -->
        <div
          class="mt-4 inline-flex items-center gap-2 rounded-full
                 bg-white/10 px-3 py-1.5"
        >


          <span class="text-[12px] font-semibold text-white/80">
            Portefeuille mis à jour
          </span>
        </div>
      </section>

      <!-- Navigation entre les catégories de ventes -->
      <nav
        class="mx-4 mt-5 flex gap-2 overflow-x-auto pb-1
               sm:mx-6 lg:mx-10 lg:mt-7"
        aria-label="Filtrer les ventes"
      >
        <!-- Toutes les ventes -->
        <button
          type="button"
          (click)="changerOnglet('toutes')"
          [ngClass]="onglet() === 'toutes'
            ? 'bg-[#0EA5A4] text-white shadow-sm'
            : 'bg-white text-[#142337] hover:bg-slate-50'"
          class="shrink-0 rounded-full px-5 py-2.5
                 text-sm font-bold transition"
        >
          Toutes
        </button>

        <!-- Ventes en attente -->
        <button
          type="button"
          (click)="changerOnglet('en_attente')"
          [ngClass]="onglet() === 'en_attente'
            ? 'bg-[#0EA5A4] text-white shadow-sm'
            : 'bg-white text-[#142337] hover:bg-slate-50'"
          class="shrink-0 rounded-full px-5 py-2.5
                 text-sm font-bold transition"
        >
          En attente
        </button>

        <!-- Ventes payées -->
        <button
          type="button"
          (click)="changerOnglet('payees')"
          [ngClass]="onglet() === 'payees'
            ? 'bg-[#0EA5A4] text-white shadow-sm'
            : 'bg-white text-[#142337] hover:bg-slate-50'"
          class="shrink-0 rounded-full px-5 py-2.5
                 text-sm font-bold transition"
        >
          Payées
        </button>
      </nav>

      <!-- Liste des ventes -->
      <section
        class="citizen-sales-list mx-4 mt-4 space-y-3
               sm:mx-6 sm:space-y-4
               lg:mx-10 lg:mt-6 lg:space-y-3"
        aria-label="Historique des ventes"
      >

        <!-- Message lorsque le filtre ne retourne aucune vente -->
        @if (ventesFiltrees().length === 0) {
          <div
            class="rounded-2xl bg-white px-5 py-10 text-center shadow-sm
                   sm:py-12"
          >
            <p class="text-sm text-slate-400">
              Aucune vente dans cet onglet.
            </p>

            <button
              type="button"
              (click)="nouvelleVente()"
              class="mt-4 rounded-full bg-[#0EA5A4] px-5 py-2.5
                     text-sm font-bold text-white transition
                     hover:bg-[#087C78]"
            >
              Faire une vente
            </button>
          </div>
        }

        <!-- Affichage de chaque vente -->
        @for (vente of ventesFiltrees(); track vente.idVente) {
          <button
            type="button"
            (click)="voirDetail(vente.idVente)"
            [attr.aria-label]="'Voir le détail de la vente ' + labelVente(vente)"
            class="citizen-sale-card flex w-full min-w-0 items-center gap-3
                   rounded-2xl bg-white p-3 text-left shadow-sm
                   transition hover:shadow-md
                   sm:gap-4 sm:p-4 lg:gap-5 lg:px-6 lg:py-5"
          >

            <!-- Icône associée au type de déchet -->
            <div
              class="flex h-10 w-10 shrink-0 items-center justify-center
                     rounded-xl sm:h-12 sm:w-12"
              [ngClass]="vente.statutPaiement === 'paye'
                ? 'bg-[#E0F9F7]'
                : 'bg-slate-100'"
            >

              <!-- Icône recyclage par défaut -->
              @if (iconeDechet(vente.typeDechet?.nom) === 'recyclage') {
                <svg
                  class="h-5 w-5 sm:h-6 sm:w-6"
                  [ngClass]="vente.statutPaiement === 'paye'
                    ? 'text-[#0EA5A4]'
                    : 'text-slate-500'"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="m7 19-3-3 3-3"></path>
                  <path d="M4 16h11a4 4 0 0 0 4-4V9"></path>
                  <path d="m17 5 3 3-3 3"></path>
                  <path d="M20 8H9a4 4 0 0 0-4 4v3"></path>
                </svg>
              }

              <!-- Icône pour le verre -->
              @if (iconeDechet(vente.typeDechet?.nom) === 'verre') {
                <svg
                  class="h-5 w-5 text-slate-500 sm:h-6 sm:w-6"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M8 22h8"></path>
                  <path d="M7 10h10"></path>
                  <path d="M9 22V12l-2-8h10l-2 8v10"></path>
                </svg>
              }

              <!-- Icône pour le métal -->
              @if (iconeDechet(vente.typeDechet?.nom) === 'metal') {
                <svg
                  class="h-5 w-5 text-slate-500 sm:h-6 sm:w-6"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"></path>
                  <path d="M3 9l2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9"></path>
                  <path d="M12 3v6"></path>
                </svg>
              }

            </div>

            <!-- Libellé et date de la vente -->
            <div class="min-w-0 flex-1">
              <p
                class="truncate text-sm font-bold text-[#142337]
                       sm:text-[15px] lg:text-base"
              >
                {{ labelVente(vente) }}
              </p>

              <p class="mt-1 text-xs text-slate-400">
                {{ formaterDate(vente.dateVente) }}
              </p>
            </div>

            <!-- Montant et statut du paiement -->
            <div class="min-w-0 shrink-0 text-right">
              <p
                class="text-xs font-bold sm:text-[15px] lg:text-base"
                [ngClass]="classeMontant(vente.statutPaiement)"
              >
                {{ vente.prixPaye | number:'1.0-0' }} FCFA
              </p>

              <span
                class="mt-1 inline-block max-w-full rounded-full px-2 py-0.5
                       text-[10px] font-bold tracking-wide"
                [ngClass]="classeStatut(vente.statutPaiement)"
              >
                {{ libelleStatut(vente.statutPaiement) }}
              </span>
            </div>

            <!-- Indicateur permettant d'ouvrir le détail -->
            <svg
              class="h-4 w-4 shrink-0 text-slate-300"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18l6-6-6-6"></path>
            </svg>

          </button>
        }

      </section>

    }

  </div>

  <!-- Bouton fixe : pleine largeur sur mobile et limité sur desktop -->
  <div
    class="fixed bottom-0 left-0 right-0 z-40"
  >
    <!-- Conteneur du bouton centré sur les grands écrans -->
    <div class="mx-auto w-full max-w-[1440px] lg:px-10">

      <button
        type="button"
        (click)="nouvelleVente()"
        class="flex h-12 w-full items-center justify-center gap-3
               rounded-xl bg-[#0EA5A4] text-sm font-bold text-white
               shadow-lg transition hover:bg-[#087C78]
               sm:h-15 sm:text-base lg:ml-auto lg:w-[320px] mb-4"
      >
        Nouvelle vente

        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>
      </button>

    </div>
  </div>

</div>
