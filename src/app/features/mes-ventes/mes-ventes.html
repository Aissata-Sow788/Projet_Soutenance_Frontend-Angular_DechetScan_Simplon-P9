<!-- Page Mes ventes — citoyen mobile -->
<div class="citizen-responsive citizen-list citizen-sales min-h-screen bg-[#F3F4F4] pb-24">

  <!-- ─── HEADER ──────────────────────────────────────────── -->
  <header class="flex h-14 items-center justify-between bg-white px-4 shadow-sm">

    <!-- Bouton retour -->
    <button
      type="button"
      (click)="retour()"
      aria-label="Retour"
      class="flex h-9 w-9 items-center justify-center rounded-full bg-[#F3F4F4] text-[#142337]"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
    </button>

    <h1 class="text-[17px] font-bold text-[#142337]">Mes ventes</h1>

    <!-- Icône filtre (décoratif) -->
    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-full bg-[#F3F4F4] text-[#142337]"
      aria-label="Filtres"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="19" cy="12" r="1"></circle>
        <circle cx="5" cy="12" r="1"></circle>
      </svg>
    </button>

  </header>

  <!-- ─── CHARGEMENT ───────────────────────────────────────── -->
  @if (chargement()) {
    <div class="flex items-center justify-center py-20">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-slate-200 border-t-[#0EA5A4]"></span>
    </div>
  }

  @else if (erreur()) {
    <div class="mx-4 mt-6 rounded-2xl bg-red-50 p-4 text-sm text-red-600">
      {{ erreur() }}
    </div>
  }

  @else {

    <!-- ─── CARTE TOTAL GAGNÉ ─────────────────────────────── -->
    <div class="citizen-sales-total mx-4 mt-5 rounded-2xl bg-[#0E172B] px-6 py-6">
      <p class="text-[11px] font-bold uppercase tracking-widest text-[#0EA5A4]">
        TOTAL GAGNÉ
      </p>
      <p class="mt-2 text-[34px] font-black text-white leading-none">
        {{ totalGagne() | number:'1.0-0' }} FCFA
      </p>
      <!-- Badge portefeuille -->
      <div class="mt-4 inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1.5">
        <span class="h-2 w-2 rounded-full bg-[#0EA5A4]"></span>
        <span class="text-[12px] font-semibold text-white/80">
          Portefeuille mis à jour
        </span>
      </div>
    </div>

    <!-- ─── ONGLETS ───────────────────────────────────────── -->
    <div class="mx-4 mt-5 flex gap-2">

      <button
        type="button"
        (click)="changerOnglet('toutes')"
        class="rounded-full px-5 py-2.5 text-sm font-bold transition"
        [ngClass]="onglet() === 'toutes'
          ? 'bg-[#0EA5A4] text-white shadow-sm'
          : 'bg-white text-[#142337]'"
      >
        Toutes
      </button>

      <button
        type="button"
        (click)="changerOnglet('en_attente')"
        class="rounded-full px-5 py-2.5 text-sm font-bold transition"
        [ngClass]="onglet() === 'en_attente'
          ? 'bg-[#0EA5A4] text-white shadow-sm'
          : 'bg-white text-[#142337]'"
      >
        En attente
      </button>

      <button
        type="button"
        (click)="changerOnglet('payees')"
        class="rounded-full px-5 py-2.5 text-sm font-bold transition"
        [ngClass]="onglet() === 'payees'
          ? 'bg-[#0EA5A4] text-white shadow-sm'
          : 'bg-white text-[#142337]'"
      >
        Payées
      </button>

    </div>

    <!-- ─── LISTE DES VENTES ──────────────────────────────── -->
    <div class="citizen-sales-list mx-4 mt-4 space-y-3">

      @if (ventesFiltrees().length === 0) {
        <div class="rounded-2xl bg-white p-8 text-center shadow-sm">
          <p class="text-sm text-slate-400">
            Aucune vente dans cet onglet.
          </p>
          <button
            type="button"
            (click)="nouvelleVente()"
            class="mt-3 rounded-full bg-[#0EA5A4] px-5 py-2.5 text-sm font-bold text-white"
          >
            Faire une vente
          </button>
        </div>
      }

      @for (vente of ventesFiltrees(); track vente.idVente) {
        <button
          type="button"
          (click)="voirDetail(vente.idVente)"
          class="citizen-sale-card flex w-full items-center gap-4 rounded-2xl bg-white p-4 shadow-sm text-left"
        >

          <!-- Icône type de déchet -->
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl"
            [ngClass]="vente.statutPaiement === 'paye'
              ? 'bg-[#E0F9F7]'
              : 'bg-slate-100'"
          >
            <!-- Icône recyclage (par défaut) -->
            @if (iconeDechet(vente.typeDechet?.nom) === 'recyclage') {
              <svg
                class="h-6 w-6"
                [ngClass]="vente.statutPaiement === 'paye' ? 'text-[#0EA5A4]' : 'text-slate-500'"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              >
                <path d="m7 19-3-3 3-3"></path>
                <path d="M4 16h11a4 4 0 0 0 4-4V9"></path>
                <path d="m17 5 3 3-3 3"></path>
                <path d="M20 8H9a4 4 0 0 0-4 4v3"></path>
              </svg>
            }
            <!-- Icône verre -->
            @if (iconeDechet(vente.typeDechet?.nom) === 'verre') {
              <svg
                class="h-6 w-6 text-slate-500"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              >
                <path d="M8 22h8"></path>
                <path d="M7 10h10"></path>
                <path d="M9 22V12l-2-8h10l-2 8v10"></path>
              </svg>
            }
            <!-- Icône métal -->
            @if (iconeDechet(vente.typeDechet?.nom) === 'metal') {
              <svg
                class="h-6 w-6 text-slate-500"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              >
                <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"></path>
                <path d="M3 9l2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9"></path>
                <path d="M12 3v6"></path>
              </svg>
            }
          </div>

          <!-- Infos vente -->
          <div class="flex-1 min-w-0">
            <p class="text-[15px] font-bold text-[#142337] truncate">
              {{ labelVente(vente) }}
            </p>
            <p class="mt-0.5 text-xs text-slate-400">
              {{ formaterDate(vente.dateVente) }}
            </p>
          </div>

          <!-- Montant + statut -->
          <div class="shrink-0 text-right">
            <p
              class="text-[15px] font-bold"
              [ngClass]="classeMontant(vente.statutPaiement)"
            >
              {{ vente.prixPaye | number:'1.0-0' }} FCFA
            </p>
            <span
              class="mt-1 inline-block rounded-full px-2 py-0.5 text-[10px] font-bold tracking-wide"
              [ngClass]="classeStatut(vente.statutPaiement)"
            >
              {{ libelleStatut(vente.statutPaiement) }}
            </span>
          </div>

          <!-- Flèche -->
          <svg class="h-4 w-4 shrink-0 text-slate-300" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"></path>
          </svg>

        </button>
      }

    </div>

  }

  <!-- ─── BOUTON NOUVELLE VENTE (fixe en bas) ──────────────── -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-[#F3F4F4]">
    <button
      type="button"
      (click)="nouvelleVente()"
      class="flex h-[56px] w-full items-center justify-center gap-3 rounded-2xl bg-[#0EA5A4] text-base font-bold text-white shadow-lg transition hover:bg-[#087C78]"
    >
      Nouvelle vente
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"></path>
        <path d="m13 6 6 6-6 6"></path>
      </svg>
    </button>
  </div>

</div>
