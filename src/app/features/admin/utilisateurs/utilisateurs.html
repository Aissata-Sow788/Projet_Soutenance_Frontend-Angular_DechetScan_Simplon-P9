<!-- Conteneur principal de la page utilisateurs. -->
<div class="w-full px-6 py-6 pb-24">

  <!-- En-tête de la page avec le titre et le bouton éventuel. -->
  <div class="mb-6">

    <!-- Titre principal de la page. -->
    <h1 class="text-[26px] font-bold text-[#142337]">
      Gestion des utilisateurs
    </h1>

    <!-- Description de la page. -->
    <p class="mt-1 text-[13px] text-slate-500">
      Consultez et gérez les utilisateurs de la plateforme.
    </p>

  </div>

  <!-- Bloc principal contenant les onglets et les outils. -->
  <div class="rounded-2xl border border-slate-200 bg-white shadow-sm">

    <!-- Onglets de navigation entre utilisateurs connectés et anonymes. -->
    <div class="flex border-b border-slate-200 px-5">

      <!-- Onglet utilisateurs connectés. -->
      <button
        type="button"
        (click)="changerOnglet('connectes')"
        [class.border-[#0EA5A4]]="ongletActif() === 'connectes'"
        [class.text-[#0EA5A4]]="ongletActif() === 'connectes'"
        [class.text-slate-500]="ongletActif() !== 'connectes'"
        class="border-b-2 px-4 py-4 text-[13px] font-semibold transition"
      >
        Utilisateurs connectés
      </button>

      <!-- Onglet utilisateurs anonymes. -->
      <button
        type="button"
        (click)="changerOnglet('anonymes')"
        [class.border-[#0EA5A4]]="ongletActif() === 'anonymes'"
        [class.text-[#0EA5A4]]="ongletActif() === 'anonymes'"
        [class.text-slate-500]="ongletActif() !== 'anonymes'"
        class="border-b-2 px-4 py-4 text-[13px] font-semibold transition"
      >
        Utilisateurs anonymes
      </button>

    </div>

    <!-- Zone contenant la recherche et les filtres. -->
    <div class="flex flex-col gap-3 p-5 lg:flex-row lg:items-center">

      <!-- Barre de recherche. -->
      <div class="relative flex-1">

        <!-- Icône de recherche. -->
        <svg
          class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>

        <!-- Champ de recherche. -->
        <input
          type="text"
          [ngModel]="recherche()"
          (ngModelChange)="changerRecherche($event)"
          placeholder="Rechercher un utilisateur..."
          class="h-10 w-full rounded-lg border border-slate-200 bg-slate-50 pl-9 pr-3 text-[12px] text-[#142337] outline-none transition focus:border-[#0EA5A4] focus:ring-2 focus:ring-[#0EA5A4]/10"
        />

      </div>

      <!-- Filtre par rôle. -->
      <select
        [ngModel]="filtreRole()"
        (ngModelChange)="changerRole($event)"
        class="h-10 rounded-lg border border-slate-200 bg-white px-3 text-[12px] text-[#142337] outline-none"
      >
        <option>Tous les rôles</option>
        <option>Citoyen</option>
        <option>Administrateur</option>
      </select>

      <!-- Filtre par statut. -->
      <select
        [ngModel]="filtreStatut()"
        (ngModelChange)="changerStatut($event)"
        class="h-10 rounded-lg border border-slate-200 bg-white px-3 text-[12px] text-[#142337] outline-none"
      >
        <option>Tous les statuts</option>
        <option>Actif</option>
        <option>Inactif</option>
      </select>

      <!-- Filtre par activité. -->
      <select
        [ngModel]="filtreActivite()"
        (ngModelChange)="changerActivite($event)"
        class="h-10 rounded-lg border border-slate-200 bg-white px-3 text-[12px] text-[#142337] outline-none"
      >
        <option>Plus récents</option>
        <option>Plus anciens</option>
      </select>

    </div>

    <!-- Message temporaire indiquant que le tableau sera connecté à l'API. -->
    <div class="px-5 pb-5">

      <!-- Zone vide temporaire avant l'intégration de Django. -->
      <div class="flex min-h-[300px] items-center justify-center rounded-xl border border-dashed border-slate-200 bg-slate-50">

        <!-- Texte temporaire. -->
        <div class="text-center">

          <!-- Icône utilisateurs. -->
          <svg
            class="mx-auto h-10 w-10 text-slate-300"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>

          <!-- Texte temporaire. -->
          <p class="mt-3 text-[13px] font-medium text-slate-500">
            Les utilisateurs seront affichés ici.
          </p>

        </div>

      </div>

    </div>

  </div>

</div>
