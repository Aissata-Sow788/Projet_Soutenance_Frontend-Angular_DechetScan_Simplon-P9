<div class="min-h-screen bg-slate-50 pb-8" *ngIf="!chargement()">

  <div *ngIf="point() as p">

    <!-- Header -->
    <header class="flex items-center gap-4 bg-[#f8f9fd] px-4 py-5">
      <button type="button" (click)="retour()" class="flex h-11 w-11 items-center justify-center rounded-full bg-white" aria-label="Retour">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M11 6l-6 6 6 6"></path>
        </svg>
      </button>
      <h1 class="text-xl font-bold text-[#172536]">Point de collecte</h1>
    </header>

    <!-- Carte interactive Leaflet -->
    <div #carte class="w-full h-64"></div>

    <div class="px-4 -mt-6 relative z-[400]">

      <!-- Carte info -->
      <div class="rounded-2xl bg-white p-4 shadow-lg">
        <h2 class="text-xl font-extrabold text-[#0F172A]">{{ p.nom }}</h2>
        <p class="text-sm text-slate-500 mt-1">{{ adresse() }}</p>

        <div class="mt-3 flex items-center gap-2 rounded-xl bg-slate-100 px-3 py-2 text-sm">
          <span class="h-2 w-2 rounded-full" [class.bg-emerald-500]="estOuvert()" [class.bg-red-500]="!estOuvert()"></span>
          <span class="font-semibold">{{ estOuvert() ? 'Ouvert' : 'Fermé' }}</span>
          <span class="text-slate-400">·</span>
          <span class="text-slate-600">{{ p.heureOuverture }} - {{ p.heureFermeture }}</span>
        </div>

        <p class="mt-4 text-xs font-bold uppercase tracking-wide text-slate-400">Déchets acceptés</p>
        <div class="flex gap-2 flex-wrap mt-2">
          <span *ngFor="let d of p.dechetsAcceptes" class="text-xs font-semibold bg-[#f0fdfb] text-[#0EA5A4] rounded-full px-3 py-1">
            {{ d.nom }}
          </span>
        </div>

        <button
          type="button"
          (click)="ouvrirItineraire()"
          class="mt-4 w-full flex items-center justify-center gap-2 rounded-xl bg-[#0EA5A4] py-3 text-white font-semibold"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
          Itinéraire
        </button>
      </div>

      <!-- Autres points à proximité -->
      <div class="mt-5" *ngIf="autresPoints().length > 0">
        <h3 class="text-lg font-bold text-[#172536] mb-2">Autres points à proximité</h3>

        <button
          *ngFor="let autre of autresPoints()"
          type="button"
          (click)="ouvrirAutrePoint(autre.idPoint)"
          class="w-full text-left flex items-center gap-3 rounded-xl bg-white p-3 shadow-sm mb-2"
        >
          <span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-[#99F6E4] text-[#0EA5A4]">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </span>
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-[#0F172A] truncate">{{ autre.nom }}</p>
            <p class="text-xs text-slate-500">{{ autre.distanceKm.toFixed(1) }} km</p>
          </div>
        </button>
      </div>

    </div>
  </div>

  <!-- Point introuvable -->
  <div *ngIf="!point()" class="flex flex-col items-center justify-center min-h-screen gap-4 px-6 text-center">
    <p class="text-slate-600">Ce point de collecte est introuvable.</p>
    <button type="button" (click)="retour()" class="rounded-full bg-[#0EA5A4] px-6 py-3 text-white font-semibold">
      Retour à la liste
    </button>
  </div>

</div>
