<div class="min-h-screen bg-[#f3f4f4] pb-24">

  <!-- =====================================================
       HEADER
       ===================================================== -->
  <header
    class="h-[86px] flex items-center justify-between
           bg-[#f8f9fd] px-6"
  >

    <!-- Logo -->
    <img
      src="assets/logo1-dechetscan.png"
      alt="DechetScan"
      class="h-10 w-auto object-contain"
    />

    <!-- Icône notification -->
    <button
      type="button"
      aria-label="Notifications"
      class="flex h-9 w-9 items-center justify-center text-[#374151]"
    >
      <svg
        class="h-6 w-6"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
        />
        <path d="M10 21h4" />
      </svg>
    </button>

  </header>


  <!-- =====================================================
       CONTENU PRINCIPAL
       ===================================================== -->
  <main class="px-5 pt-5">

    <!-- ===================================================
         FILTRES
         =================================================== -->
    <div class="flex items-center gap-2">

      <!-- Toutes -->
      <button
        type="button"
        (click)="changerFiltre('toutes')"
        class="rounded-full px-5 py-2
               text-sm font-bold
               transition"
        [class.bg-[#0EA5A4]]="filtre() === 'toutes'"
        [class.text-white]="filtre() === 'toutes'"
        [class.bg-white]="filtre() !== 'toutes'"
        [class.text-[#4B5563]]="filtre() !== 'toutes'"
      >
        Toutes ({{ notifications().length }})
      </button>

      <!-- Collectes -->
      <button
        type="button"
        (click)="changerFiltre('collectes')"
        class="rounded-full px-5 py-2
               text-sm font-semibold
               transition"
        [class.bg-[#0EA5A4]]="filtre() === 'collectes'"
        [class.text-white]="filtre() === 'collectes'"
        [class.bg-white]="filtre() !== 'collectes'"
        [class.text-[#4B5563]]="filtre() !== 'collectes'"
      >
        Collectes
      </button>

    </div>


    <!-- ===================================================
         TITRE + BOUTON TOUT MARQUER
         =================================================== -->
    <div class="mt-6 flex items-start justify-between gap-3">

      <!-- Titre -->
      <div class="flex items-start gap-3">

        <!-- Bouton retour -->
        <button
          type="button"
          class="flex h-11 w-11 flex-shrink-0
                 items-center justify-center
                 rounded-full bg-white
                 shadow-sm"
          aria-label="Retour"
        >
          <svg
            class="h-6 w-6 text-[#172536]"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 12H5" />
            <path d="M11 6l-6 6 6 6" />
          </svg>
        </button>

        <div>
          <h1
            class="text-[27px] leading-[1.1]
                   font-bold text-[#172536]"
          >
            Notifications
          </h1>

          <p
            class="mt-1 max-w-[180px]
                   text-[15px] leading-5
                   font-medium text-[#4B5563]"
          >
            Restez informé de votre impact vert
          </p>
        </div>

      </div>


      <!-- Tout marquer comme lu -->
      <button
        type="button"
        (click)="marquerToutesCommeLues()"
        class="flex min-h-[62px] w-[128px]
               flex-shrink-0 items-center justify-center
               gap-2 rounded-full
               bg-white px-3
               text-center
               text-[14px] font-bold
               leading-5 text-[#087C78]
               shadow-sm"
      >

        <!-- Icône double coche -->
        <svg
          class="h-6 w-6 flex-shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12l4 4L17 6" />
          <path d="M8 12l4 4L22 6" />
        </svg>

        <span>
          Tout marquer<br />
          comme lu
        </span>

      </button>

    </div>


    <!-- ===================================================
         LISTE DES NOTIFICATIONS
         =================================================== -->
    <section class="mt-5 space-y-4">

      <article
        *ngFor="let notification of notifications()"
        class="rounded-[20px] bg-white
               px-5 py-5
               shadow-[0_3px_8px_rgba(15,23,42,0.08)]"
      >

        <!-- Ligne supérieure -->
        <div class="flex items-start gap-3">

          <!-- Icône conseil -->
          <div
            class="flex h-[58px] w-[58px]
                   flex-shrink-0 items-center justify-center
                   rounded-full bg-[#C4F7EF]"
          >

            <svg
              class="h-8 w-8 text-[#008B86]"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <!-- Ampoule -->
              <path
                d="M9 18h6"
              />

              <path
                d="M10 22h4"
              />

              <path
                d="M8.5 14.5A6 6 0 1 1 15.5 14.5
                   C14.6 15.2 14 16.1 14 17H10
                   c0-.9-.6-1.8-1.5-2.5Z"
              />

            </svg>

          </div>


          <!-- Titre + date -->
          <div class="min-w-0 flex-1">

            <div class="flex items-center gap-2">

              <h2
                class="text-[22px] leading-7
                       font-bold text-[#172536]"
              >
                {{ notification.titre }}
              </h2>

              <!-- Point indiquant une notification non lue -->
              <span
                *ngIf="!notification.lue"
                class="h-3 w-3 flex-shrink-0
                       rounded-full bg-[#0EA5A4]"
              ></span>

            </div>

            <p
              class="mt-0.5 text-[14px]
                     font-semibold text-[#4B5563]"
            >
              {{ notification.date }}
            </p>

          </div>


          <!-- Badge Astuce éco -->
          <span
            class="hidden sm:flex
                   items-center gap-1.5
                   rounded-full
                   bg-[#D4F8F2]
                   px-3 py-2
                   text-[13px] font-bold
                   text-[#087C78]"
          >

            <!-- Icône ampoule -->
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M9 18h6M10 22h4"
              />
              <path
                d="M8.5 14.5a6 6 0 1 1 7 0
                   C14.6 15.2 14 16.1 14 17h-4
                   c0-.9-.6-1.8-1.5-2.5Z"
              />
            </svg>

            Astuce éco

          </span>

        </div>


        <!-- Badge Astuce éco sur petit écran -->
        <div class="mt-2 sm:hidden">

          <span
            class="inline-flex items-center gap-1.5
                   rounded-full
                   bg-[#D4F8F2]
                   px-3 py-1.5
                   text-[12px] font-bold
                   text-[#087C78]"
          >

            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 18h6M10 22h4" />
              <path
                d="M8.5 14.5a6 6 0 1 1 7 0
                   C14.6 15.2 14 16.1 14 17h-4
                   c0-.9-.6-1.8-1.5-2.5Z"
              />
            </svg>

            Astuce éco

          </span>

        </div>


        <!-- Message -->
        <p
          class="mt-4 ml-[71px]
                 text-[17px] leading-[1.5]
                 text-[#4B5563]"
        >
          {{ notification.message }}
        </p>


        <!-- Conseil -->
        <div
          class="mt-4 ml-[71px]
                 flex items-center gap-2
                 text-[15px] font-bold
                 text-[#087C78]"
        >

          <!-- Icône goutte d'eau -->
          <svg
            class="h-5 w-5 flex-shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12 3
                 C12 3 5 10 5 15
                 a7 7 0 0 0 14 0
                 c0-5-7-12-7-12Z"
            />
          </svg>

          <span>
            {{ notification.conseil }}
          </span>

        </div>

      </article>

    </section>

  </main>


  <!-- =====================================================
       NAVIGATION BASSE
       ===================================================== -->
  <app-barre-navigations></app-barre-navigations>

</div>
