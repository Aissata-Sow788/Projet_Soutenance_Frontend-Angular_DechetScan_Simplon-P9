<div class="min-h-screen w-full overflow-hidden bg-[#6c8197] text-white">

  <!-- ===================================================== -->
  <!-- HEADER -->
  <!-- ===================================================== -->

  <header class="flex h-[60px] items-center bg-[#f8f9fd] px-[14px] text-[#172536]">

    <!-- Retour -->
    <button type="button" class="flex h-[40px] w-[40px] items-center justify-center rounded-full bg-white" aria-label="Retour">
      <svg class="h-[20px] w-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M11 6l-6 6 6 6"></path>
      </svg>
    </button>

    <h1 class="ml-[9px] text-[18px] font-bold">Scanner</h1>

  </header>


  <!-- ===================================================== -->
  <!-- ZONE SCANNER -->
  <!-- ===================================================== -->

  <main class="relative min-h-[calc(100vh-60px)] overflow-hidden">

    <!-- BARRE SUPÉRIEURE -->
    <div class="flex items-center justify-between px-[18px] pt-[9px]">

      <div class="flex items-center gap-[7px]">
        <span class="h-[9px] w-[9px] rounded-full bg-[#91f2df]"></span>
        <span class="text-[9px] font-bold tracking-[1px] text-[#f4f6fa]">DIRECT · VISION IA</span>
      </div>

      <div class="flex items-center gap-[7px]">

        <!-- Galerie (haut) : ouvre la pellicule -->
        <button
          type="button"
          (click)="ouvrirGalerie()"
          class="flex h-[38px] w-[38px] items-center justify-center rounded-full bg-white/20"
          aria-label="Galerie"
        >
          <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <path d="M21 15l-5-5L5 21"></path>
          </svg>
        </button>

        <!-- Historique -->
        <button type="button" class="flex h-[38px] w-[38px] items-center justify-center rounded-full bg-white/20" aria-label="Historique">
          <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
            <path d="M3 4v5h5"></path>
            <path d="M12 7v5l3 2"></path>
          </svg>
        </button>

      </div>
    </div>


    <!-- TITRE -->
    <div class="px-4 pt-[32px] text-center">
      <h2 class="text-[18px] font-bold leading-[23px]">Placez le déchet dans le cadre</h2>
      <p class="mx-auto mt-[2px] max-w-[230px] text-[12px] leading-[16px] text-[#e0e5eb]">
        Reconnaissance instantanée par intelligence artificielle
      </p>
    </div>


    <!-- ===================================================== -->
    <!-- CADRE DE SCAN (avec aperçu photo si disponible) -->
    <!-- ===================================================== -->

    <div class="relative mx-auto mt-[28px] h-[330px] w-[calc(100%-58px)] max-w-[300px] overflow-hidden rounded-[52px] bg-gradient-to-b from-[#40536b] via-[#506a80] to-[#27374f]">

      <!-- Aperçu de la photo choisie, affiché par-dessus le fond -->
      <img
        *ngIf="photoApercu()"
        [src]="photoApercu()"
        alt="Aperçu du déchet"
        class="absolute inset-0 h-full w-full object-cover"
      />

      <!-- Lumière -->
      <div class="absolute left-1/2 top-1/2 h-[140px] w-[90%] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#7f9caf]/20 blur-[30px]"></div>

      <!-- Coins du viseur -->
      <div class="absolute left-[38px] top-[43px] h-[32px] w-[32px] rounded-tl-[3px] border-l-[3px] border-t-[3px] border-[#87f5dc]"></div>
      <div class="absolute right-[38px] top-[43px] h-[32px] w-[32px] rounded-tr-[3px] border-r-[3px] border-t-[3px] border-[#87f5dc]"></div>
      <div class="absolute bottom-[43px] left-[38px] h-[32px] w-[32px] rounded-bl-[3px] border-b-[3px] border-l-[3px] border-[#87f5dc]"></div>
      <div class="absolute bottom-[43px] right-[38px] h-[32px] w-[32px] rounded-br-[3px] border-b-[3px] border-r-[3px] border-[#87f5dc]"></div>

    </div>


    <!-- MODES -->
    <div class="mx-auto mt-[35px] flex h-[43px] w-[calc(100%-62px)] max-w-[300px] items-center justify-between rounded-full bg-[#a5b8c5]/60 px-[6px] backdrop-blur-md">

      <button type="button" class="flex h-[33px] flex-1 items-center justify-center gap-[4px] rounded-full text-[11px] text-[#eef3f5]">
        <svg class="h-[15px] w-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M9 3l-2 7h4l-2 11 8-13h-5l2-5z"></path>
          <path d="M3 3l18 18"></path>
        </svg>
        Flash
      </button>

      <div class="h-[21px] w-px bg-white/30"></div>

      <button type="button" class="flex h-[33px] flex-1 items-center justify-center gap-[4px] rounded-full bg-white/25 text-[11px] font-bold">
        <svg class="h-[15px] w-[15px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M3 5v14"></path>
          <path d="M6 5v14"></path>
          <path d="M9 5v14"></path>
          <path d="M13 5v14"></path>
          <path d="M16 5v14"></path>
          <path d="M21 5v14"></path>
        </svg>
        Code-barres
      </button>

      <div class="h-[21px] w-px bg-white/30"></div>

      <button type="button" class="flex h-[33px] flex-1 items-center justify-center gap-[4px] text-[11px] text-[#eef3f5]">
        <svg class="h-[14px] w-[14px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M8 3H3v5"></path>
          <path d="M16 3h5v5"></path>
          <path d="M8 21H3v-5"></path>
          <path d="M16 21h5v-5"></path>
          <circle cx="12" cy="12" r="2"></circle>
        </svg>
        Macro
      </button>

    </div>


    <!-- ===================================================== -->
    <!-- ACTIONS (caméra / galerie) -->
    <!-- ===================================================== -->

    <div class="mx-auto mt-[16px] flex max-w-[210px] items-center justify-between">

      <!-- Galerie (bas gauche) -->
      <button
        type="button"
        (click)="ouvrirGalerie()"
        class="flex h-[48px] w-[48px] items-center justify-center rounded-full bg-[#a5b7c4]/65 text-white"
        aria-label="Importer une image"
      >
        <svg class="h-[20px] w-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <circle cx="8" cy="9" r="1.5"></circle>
          <path d="M21 15l-4-4-7 7"></path>
          <path d="M16 3v5"></path>
          <path d="M13.5 5.5h5"></path>
        </svg>
      </button>

      <!-- Caméra (centre) -->
      <button
        type="button"
        (click)="ouvrirCamera()"
        class="relative flex h-[72px] w-[72px] items-center justify-center rounded-full border-[6px] border-[#a5b9c7]/70 bg-[#11aaa9]"
        aria-label="Prendre une photo"
      >
        <div class="absolute inset-[-7px] rounded-full border-[2px] border-white/10"></div>
        <svg class="h-[25px] w-[25px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>

      <!-- Réglages -->
      <button type="button" class="flex h-[48px] w-[48px] items-center justify-center rounded-full bg-[#a5b7c4]/65 text-white" aria-label="Réglages">
        <svg class="h-[20px] w-[20px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 6h16"></path>
          <path d="M4 12h16"></path>
          <path d="M4 18h16"></path>
          <circle cx="9" cy="6" r="2"></circle>
          <circle cx="15" cy="12" r="2"></circle>
          <circle cx="10" cy="18" r="2"></circle>
        </svg>
      </button>

    </div>


    <!-- ===================================================== -->
    <!-- BOUTONS REPRENDRE / ANALYSER (visibles seulement si une photo est prête) -->
    <!-- ===================================================== -->

    <div *ngIf="photoApercu()" class="mx-auto mt-[16px] flex max-w-[210px] items-center justify-between gap-3">
      <button
        type="button"
        (click)="reprendrePhoto()"
        class="flex-1 rounded-full bg-white/20 py-3 text-[13px] font-semibold"
      >
        Reprendre
      </button>
      <button
        type="button"
        (click)="envoyerAuScan()"
        [disabled]="analyseEnCours()"
        class="flex-1 rounded-full bg-[#11aaa9] py-3 text-[13px] font-semibold disabled:opacity-60"
      >
        {{ analyseEnCours() ? 'Analyse...' : 'Analyser' }}
      </button>
    </div>

  </main>


  <!-- ===================================================== -->
  <!-- INPUTS CACHÉS (déclenchés par les boutons caméra/galerie) -->
  <!-- ===================================================== -->

  <input
    #inputCamera
    type="file"
    accept="image/*"
    capture="environment"
    class="hidden"
    (change)="onFichierChoisi($event)"
  />

  <input
    #inputGalerie
    type="file"
    accept="image/*"
    class="hidden"
    (change)="onFichierChoisi($event)"
  />

</div>
