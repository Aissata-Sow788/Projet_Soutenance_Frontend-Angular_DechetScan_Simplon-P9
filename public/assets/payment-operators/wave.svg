<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150">
  <!-- Fond bleu Wave -->
  <rect width="300" height="150" rx="16" fill="#00BFFF"/>

  <!-- Corps du pingouin -->
  <!-- Ventre blanc -->
  <ellipse cx="72" cy="88" rx="20" ry="28" fill="white"/>
  <!-- Corps noir -->
  <ellipse cx="72" cy="90" rx="28" ry="36" fill="#111"/>
  <!-- Ventre blanc par-dessus -->
  <ellipse cx="72" cy="94" rx="17" ry="24" fill="white"/>

  <!-- Tête noire -->
  <circle cx="72" cy="52" r="22" fill="#111"/>

  <!-- Yeux blancs -->
  <circle cx="64" cy="48" r="5" fill="white"/>
  <circle cx="80" cy="48" r="5" fill="white"/>
  <!-- Pupilles noires -->
  <circle cx="65" cy="49" r="2.5" fill="#111"/>
  <circle cx="81" cy="49" r="2.5" fill="#111"/>

  <!-- Bec orange -->
  <ellipse cx="72" cy="59" rx="7" ry="4" fill="#FF8C00"/>

  <!-- Aile gauche (levée) -->
  <ellipse cx="44" cy="72" rx="10" ry="22" fill="#111" transform="rotate(-30 44 72)"/>

  <!-- Aile droite -->
  <ellipse cx="100" cy="82" rx="9" ry="20" fill="#111" transform="rotate(15 100 82)"/>

  <!-- Pattes orange -->
  <ellipse cx="62" cy="128" rx="10" ry="6" fill="#FF8C00"/>
  <ellipse cx="82" cy="128" rx="10" ry="6" fill="#FF8C00"/>

  <!-- Texte "wave" en blanc, police arrondie -->
  <text x="135" y="100" font-family="Arial Rounded MT Bold, Arial, sans-serif"
        font-size="62" font-weight="900" fill="white" letter-spacing="-2">wave</text>
</svg>
